# Governance category: Git, Release & Safety Governance
name: "Git, Release & Safety Governance"

on:
  pull_request:
    branches:
      - migration/nextjs
      - main

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      HUSKY: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Unit and preview asset security tests
        run: pnpm test

      - name: ESLint
        run: pnpm run lint

      - name: Generate Next.js route types
        run: pnpm exec next typegen

      - name: TypeScript
        run: pnpm run typecheck

      - name: Next.js build
        run: pnpm run build
